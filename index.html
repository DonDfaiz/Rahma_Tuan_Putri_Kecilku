<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You 💖</title>
    <!-- Font Pixel Art -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffb3d9;
            /* Background awan pink ala game retro */
            background-image: 
                radial-gradient(circle at 15% 50%, #ff80bf 10%, transparent 50%),
                radial-gradient(circle at 85% 30%, #ff99cc 15%, transparent 50%);
            font-family: 'VT323', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Container Utama */
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 10;
            width: 100%;
            padding: 20px;
        }

        /* Bingkai Gambar Pixel */
        .image-frame {
            width: 180px;
            height: 180px;
            background: #fff;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 
                -4px 0 0 0 #d61c59,
                4px 0 0 0 #d61c59,
                0 -4px 0 0 #d61c59,
                0 4px 0 0 #d61c59;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff0f5;
            animation: float 3s ease-in-out infinite;
        }

        .image-frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #d61c59;
            font-size: 3rem;
            text-shadow: 2px 2px 0px #fff;
            margin-bottom: 40px;
            line-height: 1.1;
        }

        /* Layout Tombol Flexbox - Mencegah tumpang tindih */
        .btn-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap; /* Kunci agar rapi di HP */
            width: 100%;
            min-height: 120px;
        }

        button {
            font-family: 'VT323', monospace;
            cursor: pointer;
            border: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Tombol YES */
        .yes-btn {
            background-color: #ff1a75;
            color: white;
            font-size: 2.2rem;
            padding: 12px 30px;
            border-radius: 8px;
            box-shadow: 
                0 6px 0 #b30047,
                0 6px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .yes-btn:active {
            transform: translateY(6px) !important;
            box-shadow: 0 0 0 #b30047, 0 0 5px rgba(0,0,0,0.2) !important;
        }

        /* Tombol NO */
        .no-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .no-btn {
            background-color: #ffffff;
            color: #d61c59;
            font-size: 1.5rem;
            padding: 8px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 0 #d61c59;
        }

        .no-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #d61c59;
        }

        .sub-text {
            color: #d61c59;
            font-size: 1.2rem;
            margin-top: 8px;
            text-shadow: 1px 1px 0px #fff;
            height: 20px;
        }

        /* Animasi Hati Jatuh */
        .heart {
            position: absolute;
            top: -10vh;
            color: #ff4d94;
            font-size: 1.5rem;
            opacity: 0.7;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* Responsif HP */
        @media (max-width: 480px) {
            h1 { font-size: 2.5rem; }
            .image-frame { width: 160px; height: 160px; margin-bottom: 20px; }
            .btn-container { gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <div class="image-frame">
            <!-- Gambar Awal (Kucing Memohon) -->
            <img id="main-gif" src="https://media.tenor.com/F02a3O7n8wEAAAAi/peach-goma-phone.gif" alt="Cute Cat" onerror="this.src='https://i.imgur.com/gK1q5u3.gif'">
        </div>

        <h1 id="title">Will you go out with me?</h1>

        <div class="btn-container">
            <!-- Tombol YES -->
            <button class="yes-btn" id="yes-btn" onclick="accept()">YES ✦</button>
            
            <!-- Tombol NO dan Teks bawahnya -->
            <div class="no-wrapper" id="no-wrapper">
                <button class="no-btn" id="no-btn" onclick="decline()">No</button>
                <div class="sub-text" id="sub-text"></div>
            </div>
        </div>
    </div>

    <script>
        let clickCount = 0;
        
        // Ukuran awal tombol YES
        let yesFontSize = 2.2; 
        let yesPaddingV = 12;
        let yesPaddingH = 30;

        const texts = [
            "No",
            "Are you sure?",
            "Babe please :(",
            "Don't do this to me",
            "I'm gonna cry...",
            "Give me a chance!",
            "Heart broken </3"
        ];

        function decline() {
            clickCount++;
            
            const yesBtn = document.getElementById('yes-btn');
            const noBtn = document.getElementById('no-btn');
            const subText = document.getElementById('sub-text');
            const noWrapper = document.getElementById('no-wrapper');

            // Membesarkan tombol YES secara dinamis tanpa merusak layout flexbox
            yesFontSize += 0.8;
            yesPaddingV += 5;
            yesPaddingH += 15;
            
            yesBtn.style.fontSize = `${yesFontSize}rem`;
            yesBtn.style.padding = `${yesPaddingV}px ${yesPaddingH}px`;

            // Jika belum 7 kali klik
            if (clickCount < 7) {
                noBtn.innerText = texts[clickCount];
                
                // Tambahkan sub-text hanya di momen tertentu seperti gambar referensi
                if (clickCount === 2 || clickCount === 6) {
                    subText.innerText = texts[clickCount];
                } else {
                    subText.innerText = "";
                }
            } 
            // Jika sudah 7 kali klik
            else {
                noWrapper.style.opacity = '0';
                setTimeout(() => {
                    noWrapper.style.display = 'none';
                }, 500); // Hilang secara halus
            }
        }

        function accept() {
            const card = document.getElementById('card');
            
            // Ubah tampilan menjadi layar sukses dengan animasi HUG (pelukan) romantis
            card.innerHTML = `
                <div class="image-frame" style="width: 220px; height: 220px;">
                    <img src="https://media.tenor.com/9nFkS_J_TNgAAAAi/peach-and-goma-peach-goma.gif" alt="Romantic Hug" onerror="this.src='https://i.imgur.com/ZMBG0V6.gif'">
                </div>
                <h1 style="font-size: 3.5rem; margin-top: 10px;">YAYYY! I love you! ❤️</h1>
                <p style="color: #d61c59; font-size: 1.5rem; font-weight: bold; margin-top: 10px;">I'll see you soon, babe! ✨</p>
            `;

            // Memicu hujan hati saat diterima
            setInterval(createHeart, 200);
        }

        // Animasi Hati
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // Menambahkan sedikit hati sebagai background default
        setInterval(() => {
            if(document.querySelectorAll('.heart').length < 15) {
                createHeart();
            }
        }, 800);
    </script>
</body>
</html>
